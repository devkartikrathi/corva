# Reads every connected inbox that is due, every 15 minutes.
#
# Vercel's own cron (vercel.json) only runs daily on the Hobby plan, so the
# frequent schedule lives here. On a paid Vercel plan, change the schedule in
# vercel.json to "*/15 * * * *" and delete this file.
#
# Needs the repository secret CRON_SECRET, the same value as on Vercel.
name: Read inboxes

on:
  schedule:
    # Every 15 minutes, off the hour: GitHub drops scheduled runs most at :00
    # when it is busiest. Written as a new expression on 2026-10-03 because the
    # earlier "*/15" was never scheduled at all — changing the cron line is
    # what makes GitHub register a schedule again.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

concurrency:
  group: read-inboxes
  cancel-in-progress: false

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Ask Corva to read the inboxes that are due
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          CORVA_URL: ${{ vars.CORVA_URL || 'https://corva.tiruvi.site' }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 300 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$CORVA_URL/api/cron/inbox"
